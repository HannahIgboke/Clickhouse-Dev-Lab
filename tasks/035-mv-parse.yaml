id: 35
slug: mv-parse
title: A materialized view that parses raw lines
domains: [optimizing, inserting, analyzing]
objectives: [O1, I4, A2]
tier: 2
minutes: 12
docs:
  - https://clickhouse.com/docs/materialized-view/incremental-materialized-view
  - https://clickhouse.com/docs/sql-reference/functions/splitting-merging-functions
  - https://clickhouse.com/docs/sql-reference/functions/string-functions#extractkeyvaluepairs

brief: |
  ingest.raw_events receives raw log lines (received_at DateTime, line String)
  in the form

    user=1234|action=click|amount=12.50

  1. Create ingest.events (MergeTree, sorted by action then received_at) with
  exactly: received_at DateTime, user_id UInt32, action LowCardinality(String),
  amount Decimal(10, 2).

  2. Create a materialized view ingest.events_mv TO ingest.events that parses
  every new line into those columns (no aggregation).

  3. Lines already in ingest.raw_events must end up in ingest.events too.

reset:
  - DROP DATABASE IF EXISTS ingest SYNC

setup:
  - CREATE DATABASE ingest
  - CREATE TABLE ingest.raw_events (received_at DateTime, line String) ENGINE = MergeTree ORDER BY received_at
  - |
    INSERT INTO ingest.raw_events
    SELECT toDateTime('2025-10-10 00:00:00') + (cityHash64(number, {seed}, 1) % 86400),
           concat('user=', toString(1 + cityHash64(number, {seed}, 2) % 90000),
                  '|action=', ['click', 'view', 'buy', 'refund'][1 + (cityHash64(number, {seed}, 3) % 4)],
                  '|amount=', toString(round((cityHash64(number, {seed}, 4) % 100000) / 100, 2)))
    FROM numbers(300000)

checks:
  - name: ingest.events has the exact columns, sorted by (action, received_at)
    type: sql_true
    points: 15
    query: |
      SELECT (SELECT groupArray(concat(name, ' ', type)) FROM (SELECT name, type FROM system.columns
               WHERE database = 'ingest' AND table = 'events' ORDER BY position))
             = ['received_at DateTime', 'user_id UInt32', 'action LowCardinality(String)', 'amount Decimal(10, 2)']
         AND (SELECT sorting_key = 'action, received_at' FROM system.tables WHERE database = 'ingest' AND name = 'events')
    show: SELECT concat(name, ' ', type) FROM system.columns WHERE database = 'ingest' AND table = 'events' ORDER BY position

  - name: ingest.events_mv writes TO ingest.events without aggregating
    type: sql_true
    points: 15
    query: |
      SELECT engine = 'MaterializedView' AND match(create_table_query, 'TO ingest\\.events\\b') AND positionCaseInsensitive(as_select, 'GROUP BY') = 0
      FROM system.tables WHERE database = 'ingest' AND name = 'events_mv'

  - name: Existing lines parsed and backfilled
    type: result
    points: 35
    query: |
      SELECT count() AS n, sum(user_id) AS su, sum(amount) AS sa, groupBitXor(cityHash64(received_at, user_id, toString(action), toString(amount))) AS fp
      FROM ingest.events WHERE user_id != 4000000000
    expect: |
      SELECT count() AS n, sum(u) AS su, sum(a) AS sa, groupBitXor(cityHash64(received_at, u, act, toString(a))) AS fp
      FROM (SELECT received_at, toUInt32(extract(line, 'user=(\\d+)')) AS u, extract(line, 'action=([a-z]+)') AS act,
                   toDecimal64(extract(line, 'amount=([0-9.]+)'), 2) AS a FROM ingest.raw_events)
    hint: >-
      Parse with splitByChar('|', line), extract(line, 'user=(\\d+)') or extractKeyValuePairs(line, '=', '|').
      Backfill with one INSERT ... SELECT using the same expressions.

  - name: New lines are parsed as they arrive
    type: sql_true
    points: 35
    prepare:
      - INSERT INTO ingest.raw_events VALUES ('2025-10-11 09:00:00', 'user=4000000000|action=buy|amount=0.01')
      - INSERT INTO ingest.raw_events VALUES ('2025-10-11 09:00:01', 'user=4000000000|action=refund|amount=7.25')
    query: |
      SELECT arraySort(groupArray((toString(action), toString(amount)))) = [('buy', '0.01'), ('refund', '7.25')]
      FROM ingest.events WHERE user_id = 4000000000
    show: SELECT concat(toString(action), ' ', toString(amount)) FROM ingest.events WHERE user_id = 4000000000
    cleanup:
      - DELETE FROM ingest.events WHERE user_id = 4000000000
      - DELETE FROM ingest.raw_events WHERE line LIKE 'user=4000000000|%'

solution: |
  CREATE TABLE ingest.events
  (
      received_at DateTime,
      user_id     UInt32,
      action      LowCardinality(String),
      amount      Decimal(10, 2)
  )
  ENGINE = MergeTree
  ORDER BY (action, received_at);

  CREATE MATERIALIZED VIEW ingest.events_mv TO ingest.events AS
  SELECT received_at,
         toUInt32(kv['user'])           AS user_id,
         kv['action']                   AS action,
         toDecimal64(kv['amount'], 2)   AS amount
  FROM (SELECT received_at, extractKeyValuePairs(line, '=', '|') AS kv FROM ingest.raw_events);

  INSERT INTO ingest.events
  SELECT received_at, toUInt32(kv['user']), kv['action'], toDecimal64(kv['amount'], 2)
  FROM (SELECT received_at, extractKeyValuePairs(line, '=', '|') AS kv FROM ingest.raw_events);

alternatives:
  - name: splitByChar and positional parsing
    sql: |
      CREATE TABLE ingest.events (received_at DateTime, user_id UInt32, action LowCardinality(String), amount Decimal(10, 2))
      ENGINE = MergeTree ORDER BY (action, received_at);
      CREATE MATERIALIZED VIEW ingest.events_mv TO ingest.events AS
      SELECT received_at, toUInt32(splitByChar('=', p[1])[2]) AS user_id, splitByChar('=', p[2])[2] AS action,
             toDecimal64(splitByChar('=', p[3])[2], 2) AS amount
      FROM (SELECT received_at, splitByChar('|', line) AS p FROM ingest.raw_events);
      INSERT INTO ingest.events
      SELECT received_at, toUInt32(splitByChar('=', p[1])[2]), splitByChar('=', p[2])[2], toDecimal64(splitByChar('=', p[3])[2], 2)
      FROM (SELECT received_at, splitByChar('|', line) AS p FROM ingest.raw_events);

wrong_solutions:
  - name: no backfill
    must_fail:
      - Existing lines parsed and backfilled
    sql: |
      CREATE TABLE ingest.events (received_at DateTime, user_id UInt32, action LowCardinality(String), amount Decimal(10, 2))
      ENGINE = MergeTree ORDER BY (action, received_at);
      CREATE MATERIALIZED VIEW ingest.events_mv TO ingest.events AS
      SELECT received_at, toUInt32(extract(line, 'user=(\\d+)')) AS user_id, extract(line, 'action=([a-z]+)') AS action,
             toDecimal64(extract(line, 'amount=([0-9.]+)'), 2) AS amount FROM ingest.raw_events;
