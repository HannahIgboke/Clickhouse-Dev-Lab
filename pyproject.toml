[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clickhouse-dev-lab"
version = "1.0.0"
description = "Hands-on ClickHouse certification practice — 36 auto-graded tasks, real clickhouse-client"
authors = [{name = "Hannah Igboke", email = "danielhannah663@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["click>=8", "pyyaml>=6"]

[project.scripts]
chlab = "chlab.cli:main"

[tool.setuptools.packages.find]
include = ["chlab*"]

[tool.setuptools.package-data]
"chlab" = ["tasks/*.yaml", "tasks/*.json"]