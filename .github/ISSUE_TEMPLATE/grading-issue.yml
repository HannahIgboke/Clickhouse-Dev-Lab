name: Grading issue
description: The grader marked a correct answer wrong (or a wrong one right)
labels: [grading]
body:
  - type: input
    id: task
    attributes:
      label: Task number and name
      placeholder: "8 · reviews-parquet-s3"
    validations:
      required: true
  - type: textarea
    id: sql
    attributes:
      label: The SQL you ran
      render: sql
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What `chlab check` printed
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why you think the grade is wrong
